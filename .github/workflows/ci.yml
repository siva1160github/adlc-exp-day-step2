name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore & build
        run: dotnet build src/backend/OuterloopLabApi.sln -c Release

      - name: Test
        run: dotnet test src/backend/OuterloopLabApi.sln -c Release
